name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Typecheck + Build + Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=low

      - name: Typecheck
        run: pnpm check

      - name: Build test artifacts
        run: pnpm build

      - name: Unit tests
        run: >-
          pnpm exec vitest run
          --exclude server/ahrefs.test.ts
          --exclude server/discord-steam-webhook.test.ts
          --exclude server/discord-webhook.test.ts
          --exclude server/discordTelegram.test.ts
          --exclude server/pageSpeed.test.ts
          --exclude server/sharpapi.test.ts
          --exclude server/schedulerSecrets.test.ts
        env:
          JWT_SECRET: "ci-test-secret-at-least-32-characters-long"
          SCHEDULER_SECRET: "ci-scheduler-secret-at-least-32-characters-long"
          CRON_SERVICE_TOKEN: "ci-cron-token-at-least-32-characters-long"
          NODE_ENV: test
