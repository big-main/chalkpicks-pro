## ChalkPicks Pro — GitLab CI/CD Pipeline
## Kubernetes agent: chalk (namespace: gitlab-agent-chalk)
## Observability: traces, metrics, logs

stages:
  - validate
  - test
  - build
  - deploy

variables:
  NODE_VERSION: "22"
  PNPM_VERSION: "9"
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest

# ─── Cache ────────────────────────────────────────────────────────────────────
.node_cache: &node_cache
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
    policy: pull-push

# ─── Validate ─────────────────────────────────────────────────────────────────
lint:
  stage: validate
  image: node:22-alpine
  <<: *node_cache
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  script:
    - pnpm exec tsc --noEmit
    - pnpm lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ─── Test ─────────────────────────────────────────────────────────────────────
test:
  stage: test
  image: node:22-alpine
  <<: *node_cache
  services:
    - name: mysql:8.0
      alias: mysql
      variables:
        MYSQL_ROOT_PASSWORD: testpassword
        MYSQL_DATABASE: chalkpicks_test
  variables:
    DATABASE_URL: "mysql://root:testpassword@mysql:3306/chalkpicks_test"
    JWT_SECRET: "test-jwt-secret-ci"
    NODE_ENV: "test"
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  script:
    - pnpm test --run
  coverage: '/Statements\s*:\s*(\d+\.?\d*)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ─── Build ────────────────────────────────────────────────────────────────────
build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE_TAG -t $IMAGE_LATEST .
    - docker push $IMAGE_TAG
    - docker push $IMAGE_LATEST
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ─── Deploy ───────────────────────────────────────────────────────────────────
deploy:production:
  stage: deploy
  image: bitnami/kubectl:latest
  environment:
    name: production
    url: https://chalkpicks.live
  variables:
    KUBECONFIG: /tmp/kubeconfig
  before_script:
    - echo "$KUBE_CONFIG" | base64 -d > $KUBECONFIG
  script:
    - kubectl set image deployment/chalkpicks-pro app=$IMAGE_TAG --namespace=chalkpicks
    - kubectl rollout status deployment/chalkpicks-pro --namespace=chalkpicks --timeout=120s
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  needs:
    - build
    - test

# ─── Lighthouse CI ───────────────────────────────────────────────────────────
lighthouse:
  stage: validate
  image: node:22
  <<: *node_cache
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    - npm install -g @lhci/cli
  script:
    - pnpm run build
    - lhci autorun --collect.staticDistDir=./client/dist --assert.preset=lighthouse:recommended --assert.assertions.categories:performance=off || true
  artifacts:
    paths:
      - .lighthouseci/
    expire_in: 7 days
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ─── Broken Link Checker ─────────────────────────────────────────────────────
link_check:
  stage: validate
  image: node:22-alpine
  before_script:
    - npm install -g broken-link-checker
  script:
    - blc https://chalkpicks.live --recursive --ordered --exclude-external --filter-level 3 || true
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

# ─── Security Scan ────────────────────────────────────────────────────────────
dependency_scanning:
  stage: validate
  image: node:22-alpine
  <<: *node_cache
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  script:
    - pnpm audit --audit-level=high || true
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"
