packages:
  - '.'

# patchedDependencies/overrides intentionally live in package.json's "pnpm"
# field, not here: the packageManager-pinned pnpm@10.4.1 silently ignores
# both keys when declared in pnpm-workspace.yaml (no error, no lockfile
# entry — verified via `pnpm-lock.yaml` recording neither section), so
# putting them here means they're never actually applied.
