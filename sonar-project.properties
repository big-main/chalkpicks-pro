sonar.projectKey=big-main_chalkpicks-prov2
sonar.organization=big-main

# These files are structured data (route/FAQ/SEO metadata), not logic: each
# entry necessarily repeats the same object shape with different string
# literals, which trips copy-paste detection even though there's no real
# duplicated logic to refactor away.
sonar.cpd.exclusions=\
  shared/learnPagesMeta.ts,\
  shared/seo-routes.ts,\
  shared/routeMeta.ts,\
  client/src/data/blog-posts.ts,\
  client/src/data/learnPages.tsx,\
  server/vapid.test.ts,\
  server/secrets.test.ts,\
  server/oddsApiIo.test.ts,\
  server/railway.test.ts,\
  server/revenuecat.test.ts,\
  server/routers/n8nWebhook.test.ts

# The six test files above are each "does deployed secret X exist and look
# right" checks: same it.skipIf(!process.env.X)(...) -> expect(...).toBeDefined()
# shape repeated once per secret, by design, not duplicated business logic
# to refactor away.
